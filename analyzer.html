<!DOCTYPE html>
<html class="mcss">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="midas.css">
  <script src="controls.js"></script>
  <script src="jquery.min.js"></script>
  <script src="midas.js"></script>
  <script src="mhttpd.js"></script>
  <script src="analyzer/historical_counts.js"></script>
  <title>UCN Counts</title>
  <style>

  /* Left / right columns based on this page:
      https://www.w3schools.com/html/tryit.asp?filename=tryhtml_layout_float
      */

  leftcolumn {
    float: left;
    width: 25%;
    padding: 3px;
  }


  rightcolumn {
    float: left;
    padding: 3px;
    width: 45%;
  }

  column1 {
    float: left;
    width: 30%;
    padding: 3px;
  }


  column2 {
    float: left;
    padding: 3px;
    width: 47%;
  }

  column3 {
    float: left;
    padding: 3px;
    width: 26%;
  }

  doublecolumn {
    float: left;
    padding: 3px;
    width: 88%;
  }

  /* Clear floats after the columns */
  section:after {
    content: "";
    display: table;
    clear: both;
  }

  /* Make the cells dark is they are unused*/
  /*    .UnavailableCells {      background-color: blue;     } */

  .blink {
    animation: blink-animation 1s steps(5, start) infinite;
    -webkit-animation: blink-animation 1s steps(5, start) infinite;
  }
  @keyframes blink-animation {
    to {
visibility: hidden;
    }
  }
  @-webkit-keyframes blink-animation {
    to {
visibility: hidden;
    }
  }

  </style>
  <script>


    /** initialize the table for whole-cycle counts 
     * @param {string} detector Li6|He3|He3Det2 
    */
    async function init_count_table(detector){

      // get the table
      let table = document.getElementById(`${detector}_table`);

      // header row
      let row = table.insertRow();
      let cell = row.insertCell();
      cell.className = 'mtableheader';
      cell.innerText = 'Cycle Start Time';
      cell.style.width = '250px';
      
      cell = row.insertCell();
      cell.className = 'mtableheader';
      cell.innerText = 'UCN Counts';
      cell.style.width = '250px';

      // body 
      for(let i=0; i<10; i++){
        row = table.insertRow();

        // cycle start times
        cell = row.insertCell();
        let div = document.createElement('div');
        div.className = 'modbvalue';
        div.style.textAlign = 'center';
        div.setAttribute('data-odb-path', `/Analyzer/${detector}/CycleStartTimes[${i}]`)
        cell.appendChild(div);

        // counts
        cell = row.insertCell();
        div = document.createElement('div');
        div.className = 'modbvalue';
        div.style.textAlign = 'right';
        div.setAttribute('data-odb-path', `/Analyzer/${detector}/UCNHitsPerCycle[${i}]`)
        cell.appendChild(div);
      }
    }
    
    /** initialize the table for period and cycle counts 
     * @param {string} detector Li6|He3|He3Det2 
    */
    async function init_period_table(detector){

      // get table
      let table = document.getElementById(`${detector}_period_table`);

      // header row
      let row = table.insertRow();

      let cell = row.insertCell();
      cell.className = "mtableheader";
      cell.innerText = 'Cycle Start Time';

      cell = row.insertCell();
      cell.className = "mtableheader";
      cell.innerText = 'UCN Counts Per Period';
      cell.colSpan = '10';
      
      // title row
      row = table.insertRow();
      cell = row.insertCell();
      cell.style.width = '250px'; 

      for(let i=0; i<10; i++){
        cell = row.insertCell();
        cell.innerText = i;
        cell.style.width ='60px';
        cell.style.textAlign ='center';
        cell.style.fontWeight = 'bold';
      }

      // data rows
      for(let i=0; i<10; i++){
        row = table.insertRow();

        // start time
        cell = row.insertCell();
        let div = document.createElement('div');
        div.className = "modbvalue";
        div.style.textAlign = 'center';
        div.setAttribute('data-odb-path', `/Analyzer/${detector}/CycleStartTimes[${i}]`);
        cell.appendChild(div);

        // counts
        for(let j=0; j<10; j++){
          cell = row.insertCell();
          let div = document.createElement('div');
          div.className = "modbvalue";
          div.style.textAlign = 'right';
          div.setAttribute('data-odb-path', `/Analyzer/${detector}/UCNHitsPerCyclePeriod${j}[${i}]`);
          cell.appendChild(div);
        }
      }
    }

    function setup(){
      init_count_table('Li6');
      init_count_table('He3');
      init_count_table('He3Det2');
      init_period_table('Li6');
      init_period_table('He3');
      init_period_table('He3Det2');
    }
  </script>
</head>



<body class="mcss" onload="setup();mhttpd_init('UCN Counts')"> <!--; init_historical(); -->

<div id="mmain">

  <section>

      <table class="mtable">
        <tr>
          <th colspan="2" class="mtableheader">Li-6 Online Analysis</th>
        </tr>
        <tbody id="Li6_table"></tbody>
      </table>
    </column1>

    <column1>

        <tr>
          <th colspan="2" class="mtableheader">He-3 Det1 Online Analysis</th>
        </tr>
        <tbody id="He3_table"></tbody>
      </table>
    </column1>

    <column1>
      <table class="mtable" style="display:none">
        <tr>
          <th colspan="2" class="mtableheader">He-3 Det2 Online Analysis</th>
        </tr>
        <tbody id="He3Det2_table"></tbody>
      </table>
    </column1>
  </section>

  <section>
    <column2>
      <table class="mtable">
        <tr>
          <th colspan="11" class="mtableheader">Li-6 Online Analysis Per Period</th>
        </tr>
        <tbody id="Li6_period_table"></tbody>
      </table>
    </column2>

    <column2>
      <table class="mtable">
        <tr>
          <th colspan="11" class="mtableheader">He-3 DET1 Online Analysis Per Period</th>
        </tr>
        <tbody id="He3_period_table"></tbody>
      </table>
    </column2>

    <column2>
      <table class="mtable" style="display:none">
        <tr>
          <th colspan="11" class="mtableheader">He-3 DET2 Online Analysis Per Period</th>
        </tr>
        <tbody id="He3Det2_period_table"></tbody>
      </table>
    </column2>
  </section>
